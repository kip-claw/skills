profile: openclaw-patch-check
provider: cloudflare
class: standard-4
sync:
  delete: true
  checksum: false
  fingerprint: true
  timeout: 15m
  exclude:
    - .cache
    - .turbo
    - dist
    - node_modules
env:
  allow:
    - CI
    - NODE_OPTIONS
    - NODE_ENV
setup:
  - git init && git add -A && git commit -m init --quiet
  - corepack enable
  - pnpm install --frozen-lockfile
jobs:
  build:
    command: corepack enable && pnpm install --frozen-lockfile && pnpm build
  check:
    command: git config --global user.email x@x && git config --global user.name x && git init -q && git add -A && git commit -m x -q && corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm check
  quick-check:
    command: git config --global user.email x@x && git config --global user.name x && git init -q && git add -A && git commit -m x -q && corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm tsgo:core && pnpm tsgo:extensions
  test:
    command: corepack enable && pnpm install --frozen-lockfile && pnpm test
  test-changed:
    command: git config --global user.email x@x && git config --global user.name x && git init -q && git add -A && git commit -m x -q && corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm test:changed
  gateway-smoke:
    # Build, start the gateway briefly, confirm it boots without crashing.
    command: >-
      git config --global user.email x@x &&
      git config --global user.name x &&
      git init -q && git add -A && git commit -m x -q &&
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm build &&
      echo  | base64 -d > /tmp/smoke.sh &&
      chmod +x /tmp/smoke.sh &&
      /tmp/smoke.sh
  proof:
    # Build and exercise the patched CLI to generate behavior proof for the PR.
    # Replace the PROOF COMMANDS section with fix-specific commands.
    command: >-
      git config --global user.email x@x &&
      git config --global user.name x &&
      git init -q && git add -A && git commit -m x -q &&
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm build &&
      echo "=== PROOF START ===" &&
      node openclaw.mjs --version &&
      echo "--- PROOF COMMANDS (replace with fix-specific) ---" &&
      node openclaw.mjs --help 2>&1 | head -5 &&
      echo "=== PROOF END ==="
